name: Build and upload artifact

on: [push, pull_request]

jobs:
    build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - name: Set up MSVC
              uses: ilammy/msvc-dev-cmd@v1
            - name: Install CMake 3.31
              shell: pwsh
              run: |
                python -m pip install --quiet cmake==3.31.6
                $cmakeScripts = python -c "import sysconfig; print(sysconfig.get_paths()['scripts'])"
                Add-Content $env:GITHUB_PATH $cmakeScripts
            - name: Configure CMake
              run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            - name: Build
              run: cmake --build build --config Release --target bnusio
            - uses: actions/upload-artifact@v4
              with:
                  name: TaikoArcadeLoader
                  path: dist/
                  compression-level: 9
